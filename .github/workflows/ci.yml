name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # the minimum from "engines", the active LTS and the current release
        node: ["22.18.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  package:
    name: package (tarball smoke test, signatures, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Registry signatures and provenance of the dependencies
        run: npm audit signatures
      - name: Pack, then load the packed extension and run its CLI
        run: |
          file="$(npm pack --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          mkdir "$RUNNER_TEMP/smoke"
          tar -xzf "$file" -C "$RUNNER_TEMP/smoke"
          # π provides its own packages to extensions at runtime; the dev dependencies stand in for it
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/smoke/node_modules"
          node test/smoke.ts "$RUNNER_TEMP/smoke/package" .
      - name: Coverage (fails below the floor)
        run: |
          status=0
          node --test --experimental-test-coverage \
            --test-coverage-exclude='test/**' --test-coverage-exclude='scripts/**' \
            --test-coverage-lines=78 --test-coverage-branches=65 --test-coverage-functions=75 \
            test/*.test.ts > "$RUNNER_TEMP/coverage.txt" 2>&1 || status=$?
          {
            echo "## Coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/coverage.txt" | sed 's/^# //; s/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -i "does not meet threshold" "$RUNNER_TEMP/coverage.txt" || true
          exit "$status"

  workflows:
    name: lint workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned release, checksum verified)
        env:
          VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -fsSLO "${base}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/actionlint_${VERSION}_checksums.txt"
          grep "actionlint_${VERSION}_linux_amd64.tar.gz" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
      - name: zizmor (workflow security audit)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  dependabot:
    name: merge Dependabot npm update
    # Only npm updates: they change development dependencies, which the jobs above exercise. GitHub Actions
    # updates change workflow files, which the GITHUB_TOKEN cannot merge, so they wait for a manual merge.
    needs: [test, package, workflows]
    if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
    steps:
      - name: Squash-merge the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
