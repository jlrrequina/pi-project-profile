name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  package:
    name: package (smoke, signatures, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Registry signatures of installed dependencies
        run: npm audit signatures
      - name: Pack, then import the packed extension and run its CLI
        run: |
          npm pack --silent
          mkdir .smoke
          tar -xzf ./*.tgz -C .smoke
          node test/smoke.ts .smoke/package .
      - name: Coverage summary
        run: |
          node --test --experimental-test-coverage --test-coverage-exclude='test/**' --test-coverage-exclude='scripts/**' test/*.test.ts > coverage.txt 2>&1
          {
            echo "## Coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# //; s/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned release, checksum verified)
        env:
          VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -fsSLO "${base}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/actionlint_${VERSION}_checksums.txt"
          grep "actionlint_${VERSION}_linux_amd64.tar.gz" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
