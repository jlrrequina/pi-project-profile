name: Detector corpus

# Detection on ~20 real repositories across ecosystems: invariants (deterministic,
# bounded prompt section, automatic checks are read-only) and core expectations.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "detect/**"
      - "profile/**"
      - "scripts/corpus.ts"
      - ".github/workflows/corpus.yml"

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: detect on real repositories
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Detect on real repositories
        run: node scripts/corpus.ts --dir "$RUNNER_TEMP/corpus"
